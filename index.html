<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1713">
  <title>The Smokehouse Order Pricer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">BBQ & Southern Kitchen</p>
      <h1>The Smokehouse</h1>
      <p class="subtitle">Crew Order Pricer</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="card">
      <div class="section-heading">
        <div>
          <h2>Menu</h2>
          <p>Use + and − to build the order.</p>
        </div>
        <button id="clearOrder" class="button button-secondary" type="button">Clear</button>
      </div>

      <div id="menuGrid" class="menu-grid" aria-live="polite"></div>
    </section>

    <section class="summary card">
      <div class="section-heading">
        <div>
          <h2>Order Summary</h2>
          <p id="itemCount">0 items</p>
        </div>
      </div>

      <div id="summaryLines" class="summary-lines">
        <p class="empty-message">No items have been added yet.</p>
      </div>

      <div class="totals">
        <div><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
        <div class="grand-total"><span>Total</span><strong id="grandTotal">$0.00</strong></div>
      </div>

      <div class="action-row">
        <button id="copyOrder" class="button button-primary" type="button">Copy Order</button>
        <button id="printOrder" class="button button-secondary" type="button">Print</button>
      </div>

      <p id="copyStatus" class="status" role="status"></p>
    </section>
  </main>

  <footer>
    <p>The Smokehouse • Mirror Park</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
